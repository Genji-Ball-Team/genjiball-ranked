name = "genjiball-ranked"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]
# The Genji Ball Cloudflare account (the genjiball.us zone). Pinned so a deploy never goes to whatever
# other account wrangler is logged into.
account_id = "c212ad20cc4f4b5382766735f57b91c3"
# Production: genjiball.us. `npm run deploy` applies the migrations and deploys.
routes = [{ pattern = "genjiball.us", custom_domain = true }]

# The website. Files in public/ are served as they are; any other path runs the Worker.
[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "genjiball-ranked"
database_id = "8160cd75-c556-4b7a-a7ff-35772a6ce56b"
migrations_dir = "migrations"

# Tourney verify screenshots (#28), in R2 rather than D1. Create the bucket once with
# `npx wrangler r2 bucket create genjiball-proofs` before the first deploy that has this.
[[r2_buckets]]
binding = "PROOFS"
bucket_name = "genjiball-proofs"

# Every 10 minutes: rate incomplete matches past their grace period, and recompute the ratings when
# they're stale. A run with nothing to do reads 3 rows; the free-tier budget is in docs/rating.md.
# Also deletes live lobbies whose heartbeats stopped (docs/database.md, "Live lobbies").
[triggers]
crons = ["*/10 * * * *"]

# Overrides for the defaults in src/config.ts. Leave a var out to use the default.
[vars]
LOG_LEVEL = "info"
# Matches re-rated a cron run. The free plan's 100,000 rows written a day: a recompute all day at 5
# writes about 28,800 and leaves room for a busy day of uploads (docs/rating.md, "Ratings in the database").
RATING_MATCHES_PER_RUN = "5"

# The test server (#37): the same Worker with its own D1, for playtests and trying changes before
# they reach the real leaderboard. Deploy with `npm run deploy:test`. Nothing here touches the
# production database.
[env.test]
name = "genjiball-ranked-test"
routes = [{ pattern = "test.genjiball.us", custom_domain = true }]

[[env.test.d1_databases]]
binding = "DB"
database_name = "genjiball-ranked-test"
database_id = "b925c703-2670-4642-911e-23e483117b7c"
migrations_dir = "migrations"

[[env.test.r2_buckets]]
binding = "PROOFS"
bucket_name = "genjiball-proofs-test"

[env.test.triggers]
crons = ["*/10 * * * *"]

[env.test.vars]
LOG_LEVEL = "debug"
TEST_SERVER = "true"
RATING_MATCHES_PER_RUN = "5"
