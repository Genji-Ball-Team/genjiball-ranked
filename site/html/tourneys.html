<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#0f1314">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tourneys – Genji Ball Ranked</title>
  <meta name="description" content="Upcoming Genji Ball tourneys, and the results of every past one.">
  <!-- Link previews. The Worker fills in a player's, match's or players' own for a crawler (src/site/preview.ts). -->
  <meta property="og:site_name" content="Genji Ball Ranked">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tourneys – Genji Ball Ranked">
  <meta property="og:description" content="Upcoming Genji Ball tourneys, and the results of every past one.">
  <meta property="og:url" content="https://genjiball.us/tourneys">
  <meta property="og:image" content="https://genjiball.us/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/build/fonts/saira-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/build/head.js"></script>
  <link rel="stylesheet" href="/build/site.css">
  <script type="module" src="/build/tourneys.js"></script>
</head>
<body>
  <header class="bar">
    <div class="top">
      <a class="mark" href="/"><img src="/favicon.svg" alt="" width="24" height="24">Genji Ball <span>Ranked</span></a>
      <gb-segmented id="regions" class="regions" label="Region" hidden></gb-segmented>
      <gb-nav aria-label="Main"><a href="/">Leaderboard</a><a href="/matches">Matches</a><a href="/live">Live</a><a href="/records">Records</a><a href="/tourneys" aria-current="page">Tourneys</a><a href="https://discord.gg/sv9VVjh5pT">Discord</a></gb-nav>
    </div>
  </header>
  <main class="tourneys">
    <div class="headline">
      <h1>Tourneys</h1>
    </div>
    <p class="lede">Sign up on the <a href="https://discord.gg/sv9VVjh5pT">Discord</a>.</p>
    <section id="upcoming-section" hidden>
      <h2>Coming up</h2>
      <ol id="upcoming" class="events"></ol>
    </section>
    <h2 id="results-title">Results</h2>
    <ol id="past" class="events" aria-busy="true" aria-label="Past tourneys" data-loading>
      <li><gb-skeleton block></gb-skeleton></li><li><gb-skeleton block></gb-skeleton></li><li><gb-skeleton block></gb-skeleton></li>
    </ol>
    <gb-pager id="pager" class="pager" hidden></gb-pager>
  </main>
  <footer class="foot">
    <span>Genji Ball · an Overwatch Workshop game mode</span>
    <nav class="foot-links" aria-label="More"><a href="/ranked">How ranked works</a><a href="/host">Host a lobby</a><a href="/data">Use the data</a><a href="https://discord.gg/sv9VVjh5pT">Discord</a><a href="https://github.com/Genji-Ball-Team">GitHub</a></nav>
  </footer>
</body>
</html>
