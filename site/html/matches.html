<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#0f1314">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Matches – Genji Ball Ranked</title>
  <meta name="description" content="The latest ranked Genji Ball matches: who won, who climbed.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/build/fonts/saira-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/build/head.js"></script>
  <link rel="stylesheet" href="/build/site.css">
  <script type="module" src="/build/matches.js"></script>
</head>
<body>
  <header class="bar">
    <div class="top">
      <a class="mark" href="/"><img src="/favicon.svg" alt="" width="24" height="24">Genji Ball <span>Ranked</span></a>
      <gb-segmented id="regions" class="regions" label="Region" hidden></gb-segmented>
      <gb-nav aria-label="Main"><a href="/">Leaderboard</a><a href="/matches" aria-current="page">Matches</a><a href="/live">Live</a><a href="/duels">Duels</a><a href="/tourneys">Tourneys</a><a href="/records">Records</a><a href="/ranked">How ranked works</a></gb-nav>
    </div>
  </header>
  <main>
    <div class="headline">
      <h1 id="heading">Matches</h1>
      <gb-search id="find-matches" class="player-filter" label="Find a player's matches" hide-label placeholder="Find a player's matches" min-length="2" delay="250"></gb-search>
    </div>
    <p id="about" class="lede" hidden></p>
    <ol id="matches" class="history feed" aria-busy="true" aria-label="Matches" data-loading>
      <li><gb-skeleton block></gb-skeleton></li><li><gb-skeleton block></gb-skeleton></li><li><gb-skeleton block></gb-skeleton></li><li><gb-skeleton block></gb-skeleton></li><li><gb-skeleton block></gb-skeleton></li>
    </ol>
    <gb-button id="more-matches" class="more" variant="secondary" hidden>Show more</gb-button>
  </main>
  <footer class="foot">
    <span>Genji Ball · an Overwatch Workshop game mode</span>
    <nav class="foot-links" aria-label="More"><a href="/records">Records</a><a href="/ranked">How ranked works</a><a href="/host">Host a lobby</a><a href="/data">Use the data</a><a href="https://discord.gg/sv9VVjh5pT">Discord</a><a href="https://github.com/Genji-Ball-Team">GitHub</a></nav>
  </footer>
</body>
</html>
