<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#090b10">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Player – Genji Ball Ranked</title>
  <meta name="description" content="A Genji Ball player's ranked rating, tier, form and recent matches.">
  <!-- Link previews. The Worker fills in a player's, match's or players' own for a crawler (src/site/preview.ts). -->
  <meta property="og:site_name" content="Genji Ball Ranked">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Player – Genji Ball Ranked">
  <meta property="og:description" content="A Genji Ball player's ranked rating, tier, form and recent matches.">
  <meta property="og:url" content="https://genjiball.us/player">
  <meta property="og:image" content="https://genjiball.us/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/saira-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="/region.js"></script>
</head>
<body data-page="player">
  <header class="top">
    <a class="mark" href="/"><img src="/favicon.svg" alt="" width="26" height="26">Genji Ball Ranked</a>
    <nav><a href="/">Leaderboard</a><a href="/live">Live</a><a href="/records">Records</a><a href="/tourneys">Tourneys</a><a href="https://discord.gg/sv9VVjh5pT">Discord</a></nav>
  </header>
  <main>
    <div id="hero" class="hero">
      <div class="headline"><h1 id="name">&nbsp;</h1><span id="tier"></span><p id="seal" class="seal" hidden></p></div>
      <p id="about" class="lede"></p>
      <dl id="stats" class="figures"></dl>
    </div>
    <div id="next-tier" class="next-tier"></div>
    <section id="history" hidden>
      <h2>Rating over time</h2>
      <p id="history-facts" class="facts"></p>
      <div id="graph" class="graph"></div>
      <h2>Form</h2>
      <p id="form-facts" class="facts"></p>
      <ol id="form" class="form"></ol>
    </section>
    <section id="rivals-section" hidden>
      <h2>Rivals</h2>
      <div class="rivals">
        <div><h3>Eliminated most</h3><ol id="eliminated"></ol></div>
        <div><h3>Eliminated by most</h3><ol id="eliminated-by"></ol></div>
      </div>
    </section>
    <p class="note"><a id="compare-link" hidden>Compare with another player</a></p>
    <h2>Recent matches</h2>
    <ol id="matches" class="history" aria-busy="true" data-loading>
      <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
    </ol>
  </main>
  <footer class="foot">
    <span>Genji Ball · an Overwatch Workshop game mode</span>
    <nav class="foot-links" aria-label="Genji Ball elsewhere"><a href="https://discord.gg/sv9VVjh5pT">Discord</a><a href="https://github.com/Genji-Ball-Team">GitHub</a></nav>
  </footer>
  <script src="/banner.js"></script>
  <script src="/share.js"></script>
  <script src="/site.js"></script>
</body>
</html>
