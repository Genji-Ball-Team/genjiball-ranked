<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#090b10">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Player – Genji Ball Ranked</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/saira-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="/region.js"></script>
</head>
<body data-page="player">
  <header class="top">
    <a class="mark" href="/"><img src="/favicon.svg" alt="" width="26" height="26">Genji Ball Ranked</a>
    <nav><a href="/">Leaderboard</a><a href="/live">Live</a><a href="/records">Records</a><a href="/tourneys">Tourneys</a><a href="https://discord.gg/sv9VVjh5pT">Discord</a></nav>
  </header>
  <main>
    <div class="headline"><h1 id="name">&nbsp;</h1><span id="tier"></span></div>
    <p id="about" class="lede"></p>
    <dl id="stats" class="figures"></dl>
    <div id="next-tier" class="next-tier"></div>
    <section id="history" hidden>
      <h2>Rating over time</h2>
      <p id="history-facts" class="facts"></p>
      <div id="graph" class="graph"></div>
      <h2>Form</h2>
      <p id="form-facts" class="facts"></p>
      <ol id="form" class="form"></ol>
    </section>
    <section id="rivals-section" hidden>
      <h2>Rivals</h2>
      <div class="rivals">
        <div><h3>Eliminated most</h3><ol id="eliminated"></ol></div>
        <div><h3>Eliminated by most</h3><ol id="eliminated-by"></ol></div>
      </div>
    </section>
    <p class="note"><a id="compare-link" hidden>Compare with another player</a></p>
    <h2>Recent matches</h2>
    <ol id="matches" class="history" aria-busy="true" data-loading>
      <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
    </ol>
  </main>
  <footer>Genji Ball is an Overwatch custom game. Play ranked on the <a href="https://discord.gg/sv9VVjh5pT">Discord</a>.</footer>
  <script src="/banner.js"></script>
  <script src="/site.js"></script>
</body>
</html>
