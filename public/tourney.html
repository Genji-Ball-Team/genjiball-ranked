<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#090b10">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tourney – Genji Ball Ranked</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/saira-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="/region.js"></script>
</head>
<body data-page="tourney">
  <header class="top">
    <a class="mark" href="/"><img src="/favicon.svg" alt="" width="26" height="26">Genji Ball Ranked</a>
    <nav><a href="/">Leaderboard</a><a href="/live">Live</a><a href="/records">Records</a><a href="/tourneys" aria-current="page">Tourneys</a><a href="https://discord.gg/sv9VVjh5pT">Discord</a></nav>
  </header>
  <main>
    <div class="headline"><h1 id="name">&nbsp;</h1><span id="flags"></span></div>
    <ul id="facts" class="facts"></ul>
    <p id="notes" class="lede"></p>
    <section id="signup-section" class="signup" hidden>
      <h2>Sign-ups</h2>
      <p id="signup-count" class="signup-count"></p>
      <form id="signup-form" class="signup-form" hidden>
        <label class="sr" for="signup-name">Your in-game name</label>
        <input id="signup-name" name="name" maxlength="64" autocomplete="nickname" autocapitalize="off" spellcheck="false" placeholder="Your in-game name" required>
        <button>Sign up</button>
      </form>
      <p id="signup-message" class="note" role="status"></p>
      <p id="signup-closed" class="note" hidden>Sign-ups closed when the tourney started.</p>
      <p id="signup-hint" class="note" hidden>Signing up isn't binding: it tells the admins how many lobbies to set up.</p>
      <ol id="signup-names" class="signups"></ol>
    </section>
    <div id="lobbies" aria-busy="true" data-loading>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </main>
  <footer>Genji Ball is an Overwatch custom game. Play ranked on the <a href="https://discord.gg/sv9VVjh5pT">Discord</a>.</footer>
  <script src="/banner.js"></script>
  <script src="/site.js"></script>
</body>
</html>
