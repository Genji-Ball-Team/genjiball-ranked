<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#090b10">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Compare – Genji Ball Ranked</title>
  <meta name="description" content="Ranked Genji Ball players side by side: ratings, stats, rating history and head to head.">

  <link rel="stylesheet" href="/style.css">

<body data-page="compare">
  <header class="top">
    <a class="mark" href="/"><img src="/favicon.svg" alt="" width="26" height="26">Genji Ball Ranked</a>

    <p class="lede">Up to three players side by side in <span id="region-name">this region</span>. The link to this page keeps them, to share.</p>

      <label class="find"><input id="add" type="search" placeholder="Add a player" aria-label="Add a player" autocomplete="off" aria-controls="suggest"></label>

    </div>
    <section id="h2h-section" hidden>
      <h2>Head to head</h2>
      <div id="h2h" class="h2h"></div>
    </section>
    <section id="graph-section" hidden>
      <h2>Rating over time</h2>
      <p id="key" class="key"></p>
      <div id="graph" class="graph"></div>
    </section>
  </main>
  <footer>Genji Ball is an Overwatch custom game. Play ranked on the <a href="https://discord.gg/sv9VVjh5pT">Discord</a>.</footer>
