<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#0f1314">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Compare – Genji Ball Ranked</title>
  <meta name="description" content="Ranked Genji Ball players side by side: ratings, stats, rating history and head to head.">
  <!-- Link previews. The Worker fills in a player's, match's or players' own for a crawler (src/site/preview.ts). -->
  <meta property="og:site_name" content="Genji Ball Ranked">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Compare – Genji Ball Ranked">
  <meta property="og:description" content="Ranked Genji Ball players side by side: ratings, stats, rating history and head to head.">
  <meta property="og:url" content="https://genjiball.us/compare">
  <meta property="og:image" content="https://genjiball.us/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/build/fonts/saira-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/build/site.css">
  <script src="/build/head.js"></script>
  <script type="module" src="/build/compare.js"></script>
</head>
<body>
  <header class="bar">
    <div class="top">
      <a class="mark" href="/"><img src="/favicon.svg" alt="" width="24" height="24">Genji Ball <span>Ranked</span></a>
      <gb-segmented id="regions" class="regions" label="Region" hidden></gb-segmented>
      <gb-nav aria-label="Main"><a href="/">Leaderboard</a><a href="/matches">Matches</a><a href="/live">Live</a><a href="/records">Records</a><a href="/tourneys">Tourneys</a><a href="https://discord.gg/sv9VVjh5pT">Discord</a></gb-nav>
    </div>
  </header>
  <main>
    <div id="headline" class="headline">
      <h1 id="heading">Compare</h1>
    </div>
    <div class="picker">
      <gb-search id="add" label="Add a player" hide-label placeholder="Add a player" min-length="2" delay="250"></gb-search>
    </div>
    <div id="table" class="compare" aria-live="polite" aria-busy="true" data-loading>
      <gb-skeleton block></gb-skeleton><gb-skeleton block></gb-skeleton><gb-skeleton block></gb-skeleton><gb-skeleton block></gb-skeleton>
    </div>
    <section id="h2h-section" hidden>
      <h2>Head to head</h2>
      <div id="h2h" class="h2h"></div>
    </section>
    <section id="graph-section" hidden>
      <h2>Rating over time</h2>
      <gb-compare-chart id="graph" class="graph" axis="time"></gb-compare-chart>
    </section>
  </main>
  <footer class="foot">
    <span>Genji Ball · an Overwatch Workshop game mode</span>
    <nav class="foot-links" aria-label="More"><a href="/ranked">How ranked works</a><a href="/host">Host a lobby</a><a href="https://discord.gg/sv9VVjh5pT">Discord</a><a href="https://github.com/Genji-Ball-Team">GitHub</a></nav>
  </footer>
</body>
</html>
