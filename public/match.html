<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#090b10">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Match – Genji Ball Ranked</title>
  <meta name="description" content="Every round of a ranked Genji Ball match: who won, the kills and deflects, and the rating changes.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/saira-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="/region.js"></script>
</head>
<body data-page="match">
  <header class="top">
    <a class="mark" href="/"><img src="/favicon.svg" alt="" width="26" height="26">Genji Ball Ranked</a>
    <nav><a href="/">Leaderboard</a><a href="/live">Live</a><a href="/records">Records</a><a href="/tourneys">Tourneys</a><a href="https://discord.gg/sv9VVjh5pT">Discord</a></nav>
  </header>
  <main>
    <div class="headline"><h1 id="name">&nbsp;</h1><span id="flags"></span></div>
    <ul id="facts" class="facts"></ul>
    <div id="summary" class="recap" aria-busy="true" data-loading>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
    <h2 id="rounds-heading">Rounds</h2>
    <div id="result" aria-busy="true" data-loading>
      <div class="skeleton"></div><div class="skeleton"></div>
    </div>
    <p id="notes" class="note"></p>
  </main>
  <footer class="foot">
    <span>Genji Ball · an Overwatch Workshop game mode</span>
    <nav class="foot-links" aria-label="Genji Ball elsewhere"><a href="https://discord.gg/sv9VVjh5pT">Discord</a><a href="https://github.com/Genji-Ball-Team">GitHub</a></nav>
  </footer>
  <script src="/banner.js"></script>
  <script src="/site.js"></script>
</body>
</html>
