<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#090b10">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin – Genji Ball Ranked</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/saira-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="/region.js"></script>
</head>
<body class="admin">
  <header class="top">
    <a class="mark" href="/"><img src="/favicon.svg" alt="" width="26" height="26">Genji Ball Ranked</a>
    <nav><a href="/">Leaderboard</a><a href="/tourneys">Tourneys</a><a href="/admin" aria-current="page">Admin</a></nav>
  </header>

  <main id="signin" class="signin" hidden>
    <form id="signin-form" class="signin-box">
      <h1>Admin</h1>
      <p class="muted">Sign in with your admin token. It's kept in this tab only and forgotten when you close it.</p>
      <label class="field"><span>Admin token</span>
        <input id="token" type="password" autocomplete="off" spellcheck="false" required autofocus>
      </label>
      <p id="signin-error" class="dialog-error" role="alert" hidden></p>
      <button class="primary wide">Sign in</button>
    </form>
  </main>

  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <nav id="side-nav" aria-label="Admin">
        <a href="#/" data-nav="">Overview</a>
        <a href="#/matches" data-nav="matches">Matches <span class="badge" id="badge-review" hidden></span></a>
        <a href="#/tourneys" data-nav="tourneys">Tourneys <span class="badge" id="badge-tourneys" hidden></span></a>
        <a href="#/hosts" data-nav="hosts">Hosts</a>
        <a href="#/players" data-nav="players">Players</a>
        <a href="#/log" data-nav="log">Action log</a>
        <a href="#/tools" data-nav="tools">Tools</a>
      </nav>
      <div class="side-foot">
        <span class="muted">Signed in as</span> <strong id="admin-name"></strong>
        <button type="button" id="signout" class="link">Sign out</button>
      </div>
    </aside>
    <main id="view" aria-live="polite"></main>
  </div>

  <div id="toasts" class="toasts"></div>
  <script src="/banner.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
